services:
  - type: web
    name: fairscore-backend
    env: python
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TOKEN_SECRET
        sync: false
    buildCommand: pip install -r backend/requirements.txt && python scripts/download_models.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
