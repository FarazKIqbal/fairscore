<svg xmlns="http://www.w3.org/2000/svg" width="680" height="554" viewBox="0 0 680 554" font-family="Helvetica, Arial, sans-serif">
<title>Credit scoring pipeline</title>
<desc>Borrower features are preprocessed, passed through three models, combined by a linear regression meta-learner into a credit score, explained with SHAP and LIME, then rewritten by Gemini as borrower advice.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="554" fill="#FFFFFF"/>

<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="340" y1="76" x2="340" y2="104"/>
<line x1="340" y1="150" x2="145" y2="188"/>
<line x1="340" y1="150" x2="340" y2="188"/>
<line x1="340" y1="150" x2="535" y2="188"/>
<line x1="145" y1="246" x2="340" y2="284"/>
<line x1="340" y1="246" x2="340" y2="284"/>
<line x1="535" y1="246" x2="340" y2="284"/>
<line x1="340" y1="342" x2="340" y2="370"/>
<line x1="340" y1="428" x2="340" y2="456"/>
</g>

<rect x="240" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">Borrower profile</text>
<text x="340" y="63" text-anchor="middle" font-size="12" fill="#5F5E5A">10 features</text>

<rect x="180" y="106" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">SafeLabelEncoder + StandardScaler</text>

<rect x="60" y="190" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="145" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Random forest</text>
<text x="145" y="233" text-anchor="middle" font-size="12" fill="#534AB7">Bagged trees</text>

<rect x="255" y="190" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">LightGBM</text>
<text x="340" y="233" text-anchor="middle" font-size="12" fill="#534AB7">Gradient boosting</text>

<rect x="450" y="190" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">TabTransformer</text>
<text x="535" y="233" text-anchor="middle" font-size="12" fill="#534AB7">PyTorch</text>

<rect x="180" y="286" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="309" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Linear regression meta-learner</text>
<text x="340" y="329" text-anchor="middle" font-size="12" fill="#534AB7">Credit score (300–900)</text>

<rect x="180" y="372" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">SHAP (global) + LIME (local)</text>
<text x="340" y="415" text-anchor="middle" font-size="12" fill="#0F6E56">Merged reasons</text>

<rect x="180" y="458" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="481" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Gemini rewrite</text>
<text x="340" y="501" text-anchor="middle" font-size="12" fill="#0F6E56">Borrower-facing advice</text>
</svg>
